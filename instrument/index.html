<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Instrument Study | 3D Model</title>
  <style>
    :root { color-scheme: dark; --ink: #e9edf5; --muted: #96a1b4; --line: rgba(233,237,245,.14); --accent: #e7b66b; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #0b0f16; color: var(--ink); font-family: Georgia, 'Times New Roman', serif; }
    body { overflow: hidden; }
    #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .veil { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(circle at 50% 42%, transparent 0 28%, rgba(5,8,13,.12) 68%, rgba(5,8,13,.62) 100%), linear-gradient(135deg, rgba(255,255,255,.035), transparent 38%); }
    .header { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start; padding: 30px 38px; pointer-events: none; }
    .kicker { margin: 0 0 8px; color: var(--accent); font: 11px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .2em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(30px, 4vw, 58px); font-weight: 400; letter-spacing: -.03em; }
    .meta { padding-top: 4px; text-align: right; color: var(--muted); font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .meta strong { display: block; color: var(--ink); font-weight: 500; }
    .panel { position: fixed; left: 38px; bottom: 32px; width: min(370px, calc(100vw - 76px)); padding: 17px 19px; border: 1px solid var(--line); background: rgba(11,15,22,.62); backdrop-filter: blur(16px); }
    .panel-row { display: flex; justify-content: space-between; gap: 20px; padding: 8px 0; border-bottom: 1px solid var(--line); color: var(--muted); font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .panel-row:last-child { border-bottom: 0; padding-bottom: 0; }
    .panel-row:first-child { padding-top: 0; }
    .panel-row span:last-child { color: var(--ink); text-align: right; }
    #status { color: var(--accent); }
    .hint { position: fixed; right: 38px; bottom: 35px; color: var(--muted); font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; text-align: right; }
    @media (max-width: 640px) { .header { padding: 22px; } .meta { display: none; } .panel { left: 22px; bottom: 22px; width: calc(100vw - 44px); } .hint { right: 22px; bottom: 152px; } }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="可旋转的 3D 乐器模型"></canvas>
  <div class="veil"></div>
  <header class="header">
    <div><p class="kicker">Object study / 001</p><h1>Instrument</h1></div>
    <div class="meta"><strong>Interactive 3D exhibit</strong>LIGHT / MATERIAL / FORM</div>
  </header>
  <section class="panel" aria-live="polite">
    <div class="panel-row"><span>MODEL</span><span>prompt-instrument6.glb</span></div>
    <div class="panel-row"><span>STATUS</span><span id="status">Loading model...</span></div>
    <div class="panel-row"><span>LIGHTING</span><span>Studio / Soft shadows</span></div>
  </section>
  <div class="hint">DRAG TO ROTATE<br>SCROLL TO ZOOM</div>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const canvas = document.querySelector('#scene');
    const status = document.querySelector('#status');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#0b0f16');
    const camera = new THREE.PerspectiveCamera(32, window.innerWidth / window.innerHeight, 0.01, 1000);
    camera.position.set(2.8, 1.8, 4.8);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.minDistance = 1.2;
    controls.maxDistance = 10;
    controls.target.set(0, .45, 0);

    scene.add(new THREE.HemisphereLight('#dbe8ff', '#1c2432', 2.0));
    const key = new THREE.DirectionalLight('#fff1d6', 4.4);
    key.position.set(3, 6, 4); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.camera.near = .1; key.shadow.camera.far = 20; key.shadow.camera.left = -5; key.shadow.camera.right = 5; key.shadow.camera.top = 5; key.shadow.camera.bottom = -5; scene.add(key);
    const rim = new THREE.DirectionalLight('#7da7ff', 3.2); rim.position.set(-4, 2, -4); scene.add(rim);
    const fill = new THREE.PointLight('#ffbd82', 1.5, 8); fill.position.set(1, 1, 2); scene.add(fill);

    const floor = new THREE.Mesh(new THREE.CircleGeometry(7, 96), new THREE.MeshStandardMaterial({ color: '#101722', roughness: .85, metalness: .05 }));
    floor.rotation.x = -Math.PI / 2; floor.position.y = -1.08; floor.receiveShadow = true; scene.add(floor);
    const loader = new GLTFLoader();
    loader.load('./prompt-instrument6.glb', (gltf) => {
      const model = gltf.scene;
      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const scale = 2.2 / Math.max(size.x, size.y, size.z);
      model.scale.setScalar(scale);
      model.position.set(-center.x * scale, -center.y * scale + .05, -center.z * scale);
      model.traverse((child) => { if (child.isMesh) { child.castShadow = true; child.receiveShadow = true; if (child.material) child.material.envMapIntensity = 1.2; } });
      scene.add(model);
      status.textContent = 'Ready / drag to explore';
    }, undefined, (error) => { status.textContent = 'Unable to load model'; console.error(error); });

    window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
    function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
    animate();
  </script>
</body>
</html>
